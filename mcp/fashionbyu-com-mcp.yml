  input_properties:
  - brand_slug
  - page_origin
  source_operation: null
- name: get_policies
  category: policies
  description: Get shipping, delivery, returns, refund, privacy, and terms policy page URLs for a brand storefront.
  required:
  - brand_slug
  input_properties:
  - brand_slug
  - page_origin
  source_operation: null
- name: create_cart
  category: cart
  description: Create an agent cart session. Returns a cart_token for subsequent mutations and quotes.
  required: []
  input_properties:
