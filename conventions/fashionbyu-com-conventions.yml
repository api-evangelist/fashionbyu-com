description: 'Cross-cutting runtime semantics of the IRIZ Platform API and its agent-commerce MCP surface: auth style, versioning,
  deprecation signalling, error envelope, and the absence of idempotency, rate-limit and reversibility mechanisms.'
base_url: https://mirror.fashionbyu.com/iriz/v1
api_style: REST over HTTPS, JSON responses; MCP JSON-RPC over streamable-http at /iriz/v1/agent/mcp
authentication:
  scheme: apiKey in query parameter p ("Platform gateway password or token") and bearer JWT per the OpenAPI; the agent-commerce
    read surface is unauthenticated; interop (A2A) peers use an HMAC-SHA256 header signature, a short-lived bearer from
    POST /iriz/interop/token, or an RFC 9421 HTTP message signature
  auth_levels_observed:
  - standard
  - boss
  detail: authentication/fashionbyu-com-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  scope: []
  note: 'No Idempotency-Key or equivalent is documented in the OpenAPI, the MCP tool schemas or the agent cards. The nearest
    guard is quote/confirm matching: confirm_checkout takes a quote_id and the OpenAPI documents 409 "Quote mismatch", so
    a stale or altered quote is rejected — but a repeated confirm with the same quote_id is not documented as safe. mutate_cart
    has action set (replace) which is idempotent by shape; add is not.'
dry_run_mode:
  supported: false
  coverage: none
  note: quote_cart (POST /iriz/v1/agent/cart/quote, "Quote cart with inventory hold") prices a cart before checkout, which
    is a rehearsal of totals but places an inventory hold — it is not a side-effect-free dry run.
reversibility:
  grade: none
  coverage: none
  write_surface:
  - create_cart
  - mutate_cart
  - quote_cart
  - confirm_checkout (POST /iriz/v1/agent/checkout/confirm — creates an order, "demo or Stripe")
  reversal_operations: []
  note: No cancel, refund, void or order-mutation operation exists in the OpenAPI, the MCP tool list or the route map; get_order
    is read-only. The platform publishes per-brand returns and refund policy pages (e.g. https://mirror.fashionbyu.com/brand/bwet/policies/returns
    and /policies/refund, named in the feed as return_policy and by get_policies) — those are consumer policies rendered
    as HTML behind the Cloudflare challenge, which we could not read, so no window is recorded. An agent that confirms a
    checkout has no API path to take it back.
