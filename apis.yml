apis:
- name: IRIZ Storefront Commerce MCP Server
  description: >-
    Hosted, remote MCP server (serverInfo iriz-agent-commerce 1.0.0, protocolVersion 2025-06-18, transport
    streamable-http) at https://mirror.fashionbyu.com/iriz/v1/agent/mcp (the legacy /iriz/agent/mcp still
    answers and carries Deprecation: true with a successor-version Link). tools/list and the read tools
    answer unauthenticated (search_catalog was called live on 2026-09-19 and returned BWET Swimwear products
    with variants and schema.org JSON-LD); the server's own instructions state that write tools (create_cart,
    mutate_cart, quote_cart, confirm_checkout) require a bearer token only when the operator configures
    IRIZ_AGENT_COMMERCE_TOKEN, and the commerce agent card records token_required: false. Nine tools with
    inputSchema, bound to the /iriz/v1/agent/* REST routes.
  humanURL: https://mirror.fashionbyu.com/iriz/v1/agent/mcp
  baseURL: https://mirror.fashionbyu.com/iriz/v1/agent/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Cart
  - Checkout
  - Order
  tags_raw:
  - MCP
  - Agentic Commerce
  - Carts
  - Checkout
  - Orders
  properties:
  - type: MCPServer
    url: mcp/fashionbyu-com-mcp.yml
  - type: MCPServer
    name: MCP endpoint (streamable-http, canonical v1)
    url: https://mirror.fashionbyu.com/iriz/v1/agent/mcp
  - type: ToolCrosswalk
    url: mcp/fashionbyu-com-tool-crosswalk.yml
  - type: AgentCard
    url: a2a/fashionbyu-com-a2a.yml
  - type: AgentCard
    name: Storefront Commerce agent card (provider-hosted)
    url: https://mirror.fashionbyu.com/.well-known/agent-card.json
  - type: LLMsTxt
    url: llms/fashionbyu-com-llms.txt
- name: IRIZ Platform A2A Interop Agent
  description: >-
    A2A agent card ("IRIZ Platform Agent", version 1.0.0, protocolVersions ["0.3","A2A-1.4"]) served at
    the legacy path https://mirror.fashionbyu.com/.well-known/agent.json and at https://fashionbyu.com/.well-known/agent.json.
    Four skills on the mirror host (propose_improvement, platform_status, revision_request, coding_task;
    the root-host copy lists two and sets x-iriz.enabled false). The task endpoint https://mirror.fashionbyu.com/iriz/interop/tasks
    answers a GET with 404 endpoint_not_found and an unauthenticated POST with 401 peer_credentials_required,
    so the transport is served and gated on registered-peer credentials (HMAC-SHA256 x-iriz-peer-sig headers,
    a short-lived bearer from POST /iriz/interop/token, or an RFC 9421 HTTP message signature). Declares
    A2UI output and an AP2 verify endpoint (ap2_max_usd_default 0).
  humanURL: https://mirror.fashionbyu.com/.well-known/agent.json
  baseURL: https://mirror.fashionbyu.com/iriz/interop/tasks
  tags:
  - A2A
  - AI Agents
  - Governance
  - Task Delegation
  properties:
  - type: AgentCard
    url: a2a/fashionbyu-com-interop-a2a.yml
  - type: AgentCard
    name: Platform Interop agent card (provider-hosted, legacy path)
    url: https://mirror.fashionbyu.com/.well-known/agent.json
