- name: IRIZ Platform A2A Interop Agent
  description: 'A2A agent card ("IRIZ Platform Agent", version 1.0.0, protocolVersions ["0.3","A2A-1.4"]) served at the
    legacy path https://mirror.fashionbyu.com/.well-known/agent.json and at https://fashionbyu.com/.well-known/agent.json.
    Four skills on the mirror host (propose_improvement, platform_status, revision_request, coding_task; the root-host
    copy lists two and sets x-iriz.enabled false). The task endpoint https://mirror.fashionbyu.com/iriz/interop/tasks
    answers a GET with 404 endpoint_not_found and an unauthenticated POST with 401 peer_credentials_required, so the
    transport is served and gated on registered-peer credentials (HMAC-SHA256 x-iriz-peer-sig headers, a short-lived
    bearer from POST /iriz/interop/token, or an RFC 9421 HTTP message signature). Declares A2UI output and an AP2
    verify endpoint (ap2_max_usd_default 0).'
  humanURL: https://mirror.fashionbyu.com/.well-known/agent.json
  baseURL: https://mirror.fashionbyu.com/iriz/interop/tasks
