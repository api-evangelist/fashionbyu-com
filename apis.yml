apis:
- name: IRIZ Platform API
  description: 'First-party REST API of the IRIZ storefront platform, described by an auto-generated OpenAPI 3.0.0
    document (info.title "IRIZ Platform API", info.version v4.10.829+api-v1, 108 operations, no operationIds, no
    component schemas, response descriptions only) served at https://mirror.fashionbyu.com/iriz/v1/docs/spec.json and
    rendered by Swagger UI at /iriz/docs. Canonical base path /iriz/v1/; the 28 legacy /iriz/* and root paths are marked
    deprecated and answer with Deprecation: true plus a Link rel="successor-version" header. The public, unauthenticated
    slice is the agent-commerce surface (GET /iriz/v1/agent/catalog, POST /iriz/v1/agent/cart/session, /cart/quote,
    /checkout/confirm, GET /iriz/agent/brands, /iriz/agent/search, /iriz/agent/policies, GET /iriz/health, GET
    /iriz/versions); the platform-operations routes (deploy, vigil, sentinel, healer, scribe, herald, boss) answer 401
    {"code":"UNAUTHORIZED","auth_level":"standard"|"boss"}. Security schemes: apiKey in query param p, and bearer JWT.'
  humanURL: https://mirror.fashionbyu.com/iriz/docs
