- name: IRIZ Storefront Commerce MCP Server
  description: 'Hosted, remote MCP server (serverInfo iriz-agent-commerce 1.0.0, protocolVersion 2025-06-18, transport
    streamable-http) at https://mirror.fashionbyu.com/iriz/v1/agent/mcp (the legacy /iriz/agent/mcp still answers and
    carries Deprecation: true with a successor-version Link). tools/list and the read tools answer unauthenticated
    (search_catalog was called live on 2026-09-19 and returned BWET Swimwear products with variants and schema.org
    JSON-LD); the server''s own instructions state that write tools (create_cart, mutate_cart, quote_cart,
    confirm_checkout) require a bearer token only when the operator configures IRIZ_AGENT_COMMERCE_TOKEN, and the
    commerce agent card records token_required: false. Nine tools with inputSchema, bound to the /iriz/v1/agent/*
    REST routes.'
  humanURL: https://mirror.fashionbyu.com/iriz/v1/agent/mcp
