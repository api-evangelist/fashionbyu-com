aid: fashionbyu-com
name: IRIZ Platform
description: 'IRIZ Platform is the multi-brand, agent-first fashion storefront platform behind fashionbyu.com (brands such
  as BWET Swimwear, Me+Em, Kitri Studio, Lisou London and Réalisation Par are hosted as /brand/<slug> storefronts). It
  publishes a first-party OpenAPI 3.0.0 ("IRIZ Platform API", 108 operations, canonical base path /iriz/v1/) at
  https://mirror.fashionbyu.com/iriz/v1/docs/spec.json with a Swagger UI at /iriz/docs, a live hosted MCP server
  (iriz-agent-commerce, protocol 2025-06-18, nine tools: search_catalog, get_product_feed, get_policies, create_cart,
  mutate_cart, get_cart, quote_cart, confirm_checkout, get_order) whose tools/list answers unauthenticated, two A2A
  agent cards (a Storefront Commerce card at the canonical /.well-known/agent-card.json and a Platform Interop card at
  the legacy /.well-known/agent.json, both flavored: protocolVersions[] instead of protocolVersion), an llms.txt and an
  agent-welcoming robots.txt, and per-brand OpenAI/ACP-compatible product feeds (/brand/<slug>/feed.json) with
  schema.org Product JSON-LD. The platform runs on Cloudflare Workers (D1/KV/R2/queues/Durable Objects per /iriz/health);
  HTML pages sit behind a Cloudflare managed challenge while the JSON surfaces answer directly. The registrable domain
  fashionbyu.com serves the interop card, llms.txt and the brand feeds but 404s the MCP and REST routes, which live on
  mirror.fashionbyu.com; every link inside the provider''s own llms.txt and robots.txt points at www.fashionbyu.com,
  which does not resolve (NXDOMAIN on 2026-09-19).'
